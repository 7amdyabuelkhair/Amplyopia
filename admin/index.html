<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amplyopia Admin - Notifications</title>
  <link rel="icon" id="app-favicon-ico" href="/images/logo/yellow-favicon.ico" sizes="any">
  <link rel="icon" id="app-favicon-svg" type="image/svg+xml" href="/images/logo/yellow-favicon.svg">
  <link rel="icon" id="app-favicon-png" type="image/png" sizes="96x96" href="/images/logo/yellow-favicon-96x96.png">
  <link rel="apple-touch-icon" id="app-apple-touch" href="/images/logo/yellow-apple-touch-icon.png">
  <link rel="manifest" id="app-manifest" href="/manifest-guest.json">
  <meta name="theme-color" id="app-theme-color" content="#ffe066">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/pwa.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="theme-guest">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html#services">
        <img src="/images/logo/yellow-favicon-96x96.png" alt="Amplyopia" class="logo-img" id="site-logo-img" width="40" height="40">
        <span class="logo-text">amplyopia admin</span>
      </a>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="auth-card">
        <div class="auth-body">
          <h1 class="step-title" style="font-size:30px;">Admin Dashboard</h1>
          <p class="step-subtitle">Send custom notifications to selected users.</p>
          <div class="auth-error" id="admin-error" aria-live="polite"></div>
          <div class="auth-success" id="admin-success" aria-live="polite"></div>

          <div id="admin-auth-panel">
            <p class="step-subtitle" style="margin-bottom:14px;">
              Sign in on the home page with an authorized admin account, then open <strong>Admin</strong> from Choose Service.
            </p>
            <a href="../index.html#services" class="btn btn-primary">Back to Choose Service</a>
          </div>

          <div id="admin-panel" class="hidden">
            <div class="form-actions" style="margin-top:0;">
              <button type="button" class="btn btn-secondary" id="admin-back-btn">Back to Choose Service</button>
              <button type="button" class="btn btn-primary" id="admin-refresh-btn">Refresh users</button>
            </div>

            <form id="admin-notify-form" class="user-form" style="margin-top:18px;">
              <div class="form-group">
                <label for="notify-title">Notification title</label>
                <input id="notify-title" required maxlength="80" placeholder="Training reminder">
              </div>
              <div class="form-group">
                <label for="notify-body">Notification message</label>
                <textarea id="notify-body" required rows="3" maxlength="240" placeholder="Time for your vision exercises!"></textarea>
              </div>
              <div class="form-group">
                <label for="notify-url">Open URL (optional)</label>
                <input id="notify-url" placeholder="/lazytest/index.html">
              </div>

              <div class="admin-users-toolbar">
                <strong>Select recipients</strong>
                <div>
                  <button type="button" class="btn btn-secondary" id="admin-select-all">Select all</button>
                  <button type="button" class="btn btn-secondary" id="admin-select-none">Clear</button>
                </div>
              </div>
              <div id="admin-users-list" class="admin-users-list"></div>

              <button type="submit" class="btn btn-primary">Send notification</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/vendor/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/pwa-config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/branding.js"></script>
  <script src="../js/profile.js"></script>
  <script src="admin.js"></script>
</body>
</html>
