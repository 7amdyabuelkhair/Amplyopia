<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Child Profile - Amplyopia</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/pwa.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" id="app-favicon-png" type="image/png" sizes="96x96" href="/images/logo/yellow-favicon-96x96.png">
    <link rel="manifest" id="app-manifest" href="/manifest-guest.json">
    <meta name="theme-color" id="app-theme-color" content="#ffe066">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="services.html">
                <img src="images/logo/yellow-favicon-96x96.png" alt="Amplyopia" class="logo-img" id="site-logo-img" width="40" height="40">
                <span class="logo-text">amplyopia</span>
            </a>
            <nav class="site-nav" aria-label="Primary">
                <ul>
                    <li><button type="button" class="nav-signout" id="nav-signout-btn">Sign out</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content" id="profile-main" hidden>
        <div class="container">
            <div class="wizard-step active">
                <div class="step-content">
                    <div class="step-header">
                        <img src="images/logo/yellow-favicon-96x96.png" alt="Child profile" class="step-icon">
                        <h1 class="step-title">Set up child profile</h1>
                        <p class="step-subtitle">Choose boy or girl, enter name and birthday to continue</p>
                    </div>

                    <div class="auth-card">
                        <div class="auth-body">
                            <p class="auth-success" id="profile-welcome"></p>
                            <div class="auth-error" id="profile-error" aria-live="polite"></div>

                            <form class="user-form" id="profile-form">
                                <div class="profile-grid">
                                    <div class="form-group">
                                        <label for="profile-name">Child Name</label>
                                        <input type="text" id="profile-name" name="name" placeholder="Enter child name" autocomplete="name" required>
                                    </div>

                                    <div class="form-group">
                                        <label>Child Gender</label>
                                        <div class="gender-cards" role="radiogroup" aria-label="Child gender">
                                            <label class="gender-card">
                                                <input type="radio" name="gender" value="boy" required>
                                                <span class="gender-card-inner">
                                                    <img src="images/boy.png" alt="Boy" class="gender-avatar" onerror="this.style.display='none';">
                                                    <span class="gender-title">Boy</span>
                                                </span>
                                            </label>
                                            <label class="gender-card">
                                                <input type="radio" name="gender" value="girl" required>
                                                <span class="gender-card-inner">
                                                    <img src="images/girl.png" alt="Girl" class="gender-avatar" onerror="this.style.display='none';">
                                                    <span class="gender-title">Girl</span>
                                                </span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="profile-birthdate">Child Birthday</label>
                                        <input type="date" id="profile-birthdate" name="birthdate" required>
                                    </div>
                                </div>

                                <div class="form-actions">
                                    <button type="button" class="btn btn-secondary" id="auth-signout-btn">Sign out</button>
                                    <button type="submit" class="btn btn-primary btn-next">
                                        Save &amp; Continue
                                        <span class="btn-arrow">→</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="auth-loading" class="auth-loading" role="status" aria-live="polite" aria-busy="true">
        <div class="auth-loading-card">
            <div class="auth-loading-spinner" aria-hidden="true"></div>
            <p class="auth-loading-title">Please wait</p>
            <p class="auth-loading-text" id="auth-loading-text">Loading profile…</p>
        </div>
    </div>

    <script src="js/vendor/supabase.min.js?v=2.3.0"></script>
    <script src="js/supabase-config.js?v=2.3.0"></script>
    <script src="js/supabase.js?v=2.3.0"></script>
    <script src="js/branding.js?v=2.3.0"></script>
    <script src="js/profile.js?v=2.3.0"></script>
    <script src="js/auth-profile.js?v=2.3.0"></script>
    <script src="js/profile-setup-page.js?v=2.3.0"></script>
</body>
</html>
